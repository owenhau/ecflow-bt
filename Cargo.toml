[package]
name = "ecflow-bt"
version = "0.1.0"
edition = "2024"

[dependencies]
aes = "0.9.4"
anyhow = "1.0.104"
btleplug = "0.13.5"
cbc = { version = "0.2.1", features = ["block-padding"] }
chrono = { version = "0.4.45", default-features = false, features = ["clock"] }
clap = { version = "4.6.9", features = ["derive"] }
crossterm = "0.29.0"
directories = "6.0.0"
futures = "0.3.34"
hex = "0.4.3"
libdbus-sys = { version = "0.2.7", features = ["vendored"] }
md-5 = "0.11.0"
num-bigint = "0.5.1"
num-traits = "0.2.19"
prost = "0.14.6"
rand = "0.10.4"
ratatui = "0.30.2"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
thiserror = "2.0.21"
tokio = { version = "1.54.1", features = ["full"] }
toml = "1.2.2"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
uuid = "1.29.3"
zeroize = { version = "1.9.2", features = ["derive"] }

[profile.dev.package."*"]
opt-level = 3
